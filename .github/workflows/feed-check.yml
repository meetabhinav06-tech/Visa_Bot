name: Evaluate UK Austria feed
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Read candidate availability feed once
        env:
          PARSE_API_KEY: ${{ secrets.PARSE_API_KEY }}
        run: python probe_parse.py
