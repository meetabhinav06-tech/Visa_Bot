name: Austria visa alerts
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Select simulation or a notification test
        type: choice
        options: [simulate, test-email, test-whatsapp, live]
        default: simulate
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
concurrency:
  group: austria-alerts
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || vars.LIVE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - uses: actions/cache/restore@v6
        if: inputs.mode == 'live' || github.event_name == 'schedule'
        with:
          path: state
          key: alerts-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: alerts-state-
      - name: Run bot
        env:
          MODE: ${{ inputs.mode || 'live' }}
          LIVE_ENABLED: ${{ vars.LIVE_ENABLED }}
          SOURCE_AUTHORISED: ${{ vars.SOURCE_AUTHORISED }}
          SOURCE_PERMISSION_REFERENCE: ${{ vars.SOURCE_PERMISSION_REFERENCE }}
          FEED_URL: ${{ secrets.FEED_URL }}
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
          CHANNELS: email,whatsapp
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          WHATSAPP_FROM: ${{ secrets.WHATSAPP_FROM }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          TWILIO_CONTENT_SID: ${{ secrets.TWILIO_CONTENT_SID }}
          WHATSAPP_TEST_SESSION_OPEN: ${{ vars.WHATSAPP_TEST_SESSION_OPEN }}
        run: python bot.py "$MODE"
      - uses: actions/cache/save@v6
        if: always() && hashFiles('state/sent.json') != ''
        with:
          path: state
          key: alerts-state-${{ github.run_id }}-${{ github.run_attempt }}
